<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline - RTS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .offline-container {
            max-width: 400px;
            padding: 2rem;
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .features {
            margin-top: 2rem;
            text-align: left;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }

        .feature-icon {
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .offline-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📱</div>
        <h1>You're Offline</h1>
        <p>No internet connection detected. Some features may be limited while offline.</p>

        <button class="retry-button" onclick="retryConnection()">
            Try Again
        </button>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">✅</span>
                <span>Cached pages still work</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💾</span>
                <span>Data saved locally</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🔄</span>
                <span>Will sync when online</span>
            </div>
        </div>
    </div>

    <script>
        function retryConnection() {
            // Show loading state
            const button = document.querySelector('.retry-button');
            const originalText = button.textContent;
            button.textContent = 'Checking...';
            button.disabled = true;

            // Try to fetch a small resource to check connectivity
            fetch('/?offline-check', {
                method: 'HEAD',
                cache: 'no-cache'
            })
            .then(() => {
                // Online - reload the page
                window.location.reload();
            })
            .catch(() => {
                // Still offline
                button.textContent = originalText;
                button.disabled = false;

                // Show feedback
                button.textContent = 'Still Offline';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }

        // Auto-retry when the browser detects we're back online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Update UI based on connection status
        function updateConnectionStatus() {
            if (navigator.onLine) {
                // Browser thinks we're online, but we're on the offline page
                // This means the initial request failed, so we should retry
                retryConnection();
            }
        }

        // Check connection status periodically
        setInterval(updateConnectionStatus, 30000); // Check every 30 seconds
    </script>
</body>
</html>
