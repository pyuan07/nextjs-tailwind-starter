<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#appGradient)" />

  <!-- App icon - Modern geometric design -->
  <g transform="translate(256,256)">
    <!-- Main shape -->
    <rect x="-80" y="-80" width="160" height="160" rx="24" fill="white" opacity="0.9"/>

    <!-- Accent elements -->
    <circle cx="-40" cy="-40" r="16" fill="white"/>
    <circle cx="40" cy="-40" r="16" fill="white"/>
    <rect x="-60" y="20" width="120" height="8" rx="4" fill="white"/>
    <rect x="-40" y="40" width="80" height="8" rx="4" fill="white"/>
  </g>

  <!-- App name -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">RTS</text>
</svg>